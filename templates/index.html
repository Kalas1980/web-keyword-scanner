<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Web Keyword Scanner</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --border: #2a2d3a;
      --accent: #6c63ff;
      --accent-hover: #8b84ff;
      --text: #e2e4f0;
      --muted: #7b7f96;
      --match: #22c55e;
      --error: #ef4444;
      --warn: #f59e0b;
      --radius: 10px;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 18px 28px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 12px;
    }

    header .logo {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.3px;
    }

    header .logo span { color: var(--accent); }

    header .badge {
      font-size: 11px;
      background: #2a2d3a;
      color: var(--muted);
      padding: 2px 8px;
      border-radius: 20px;
      border: 1px solid var(--border);
    }

    .layout {
      display: grid;
      grid-template-columns: 360px 1fr;
      flex: 1;
      overflow: hidden;
    }

    /* ── Sidebar ── */
    .sidebar {
      border-right: 1px solid var(--border);
      padding: 24px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .section-label {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .tab-row {
      display: flex;
      gap: 6px;
      background: var(--surface);
      border-radius: var(--radius);
      padding: 4px;
    }

    .tab-btn {
      flex: 1;
      padding: 7px 0;
      font-size: 13px;
      font-weight: 500;
      border: none;
      border-radius: 7px;
      cursor: pointer;
      background: transparent;
      color: var(--muted);
      transition: background 0.15s, color 0.15s;
    }

    .tab-btn.active {
      background: var(--accent);
      color: #fff;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: var(--muted);
      margin-bottom: 6px;
    }

    input[type="text"], input[type="number"], textarea, select {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-size: 13px;
      padding: 9px 12px;
      outline: none;
      transition: border-color 0.15s;
      font-family: inherit;
      resize: vertical;
    }

    input:focus, textarea:focus, select:focus {
      border-color: var(--accent);
    }

    textarea { min-height: 90px; }

    .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      background: var(--surface);
      border-radius: var(--radius);
      border: 1px solid var(--border);
    }

    .toggle-row span { font-size: 13px; }

    .toggle {
      position: relative;
      width: 36px;
      height: 20px;
      cursor: pointer;
    }

    .toggle input { opacity: 0; width: 0; height: 0; }

    .slider {
      position: absolute;
      inset: 0;
      background: var(--border);
      border-radius: 20px;
      transition: background 0.2s;
    }

    .slider::before {
      content: "";
      position: absolute;
      width: 14px; height: 14px;
      left: 3px; bottom: 3px;
      background: #fff;
      border-radius: 50%;
      transition: transform 0.2s;
    }

    .toggle input:checked + .slider { background: var(--accent); }
    .toggle input:checked + .slider::before { transform: translateX(16px); }

    .btn-scan {
      width: 100%;
      padding: 12px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: var(--radius);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, opacity 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-scan:hover { background: var(--accent-hover); }
    .btn-scan:disabled { opacity: 0.5; cursor: not-allowed; }

    .btn-stop {
      width: 100%;
      padding: 10px;
      background: transparent;
      color: var(--error);
      border: 1px solid var(--error);
      border-radius: var(--radius);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
      display: none;
    }

    .btn-stop:hover { background: rgba(239,68,68,0.1); }

    /* ── Main panel ── */
    .main {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .stats-bar {
      display: flex;
      gap: 24px;
      padding: 14px 24px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }

    .stat { display: flex; flex-direction: column; gap: 2px; }
    .stat-val { font-size: 22px; font-weight: 700; }
    .stat-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }

    .stat-val.green { color: var(--match); }
    .stat-val.blue  { color: var(--accent); }

    .progress-wrap {
      padding: 0 24px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }

    .progress-bar {
      height: 3px;
      background: var(--border);
      border-radius: 3px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: var(--accent);
      border-radius: 3px;
      transition: width 0.3s ease;
      width: 0%;
    }

    .current-url {
      font-size: 11px;
      color: var(--muted);
      padding: 5px 0 8px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .results-area {
      flex: 1;
      overflow-y: auto;
      padding: 20px 24px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      gap: 12px;
      text-align: center;
    }

    .empty-state svg { opacity: 0.3; }
    .empty-state p { font-size: 14px; }

    .result-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      animation: fadeIn 0.2s ease;
    }

    .result-card.error-card { border-color: var(--error); opacity: 0.6; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .result-url {
      font-size: 13px;
      font-weight: 600;
      color: var(--accent);
      text-decoration: none;
      word-break: break-all;
    }

    .result-url:hover { text-decoration: underline; }

    .kw-tags { display: flex; flex-wrap: wrap; gap: 6px; }

    .kw-tag {
      font-size: 11px;
      font-weight: 600;
      background: rgba(108,99,255,0.15);
      color: var(--accent-hover);
      border: 1px solid rgba(108,99,255,0.3);
      border-radius: 5px;
      padding: 2px 8px;
    }

    .snippet {
      font-size: 12px;
      color: var(--muted);
      line-height: 1.6;
      border-left: 2px solid var(--border);
      padding-left: 10px;
    }

    .done-banner {
      background: rgba(34,197,94,0.1);
      border: 1px solid rgba(34,197,94,0.3);
      border-radius: var(--radius);
      padding: 12px 16px;
      font-size: 13px;
      color: var(--match);
      display: none;
      align-items: center;
      gap: 8px;
    }

    .export-btn {
      margin-left: auto;
      padding: 5px 14px;
      font-size: 12px;
      font-weight: 600;
      background: rgba(34,197,94,0.15);
      color: var(--match);
      border: 1px solid rgba(34,197,94,0.3);
      border-radius: 6px;
      cursor: pointer;
    }

    .export-btn:hover { background: rgba(34,197,94,0.25); }

    @media (max-width: 768px) {
      .layout { grid-template-columns: 1fr; }
      .sidebar { border-right: none; border-bottom: 1px solid var(--border); }
    }
  </style>
</head>
<body>

<header>
  <div class="logo">Web<span>Scan</span></div>
  <div class="badge">Keyword Scanner</div>
</header>

<div class="layout">

  <!-- ── Sidebar form ── -->
  <aside class="sidebar">

    <!-- Mode tabs -->
    <div>
      <div class="section-label">Scan Mode</div>
      <div class="tab-row">
        <button class="tab-btn active" onclick="setMode('crawl')">Crawl URL</button>
        <button class="tab-btn" onclick="setMode('list')">URL List</button>
        <button class="tab-btn" onclick="setMode('both')">Both</button>
      </div>
    </div>

    <!-- Start URL (crawl / both) -->
    <div id="field-start">
      <label>Starting URL</label>
      <input type="text" id="start-url" placeholder="https://example.com" />
    </div>

    <!-- URL list (list / both) -->
    <div id="field-list" style="display:none">
      <label>URL List <span style="color:var(--muted);font-weight:400">(one per line)</span></label>
      <textarea id="url-list" placeholder="https://example.com/page1&#10;https://example.com/page2"></textarea>
    </div>

    <!-- Keywords -->
    <div>
      <label>Keywords <span style="color:var(--muted);font-weight:400">(comma-separated)</span></label>
      <input type="text" id="keywords" placeholder="security, vulnerability, api key" />
    </div>

    <!-- Depth + pages -->
    <div class="row2" id="crawl-opts">
      <div>
        <label>Crawl Depth</label>
        <input type="number" id="max-depth" value="2" min="0" max="5" />
      </div>
      <div>
        <label>Max Pages</label>
        <input type="number" id="max-pages" value="50" min="1" max="200" />
      </div>
    </div>

    <!-- Same domain toggle -->
    <div class="toggle-row" id="domain-toggle-wrap">
      <span>Same domain only</span>
      <label class="toggle">
        <input type="checkbox" id="same-domain" checked />
        <span class="slider"></span>
      </label>
    </div>

    <button class="btn-scan" id="btn-scan" onclick="startScan()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      Start Scan
    </button>

    <button class="btn-stop" id="btn-stop" onclick="stopScan()">Stop</button>

  </aside>

  <!-- ── Main results panel ── -->
  <main class="main">

    <!-- Stats bar -->
    <div class="stats-bar">
      <div class="stat">
        <span class="stat-val blue" id="stat-scanned">0</span>
        <span class="stat-label">Pages Scanned</span>
      </div>
      <div class="stat">
        <span class="stat-val green" id="stat-found">0</span>
        <span class="stat-label">Matches Found</span>
      </div>
      <div class="stat" style="margin-left:auto;align-items:flex-end">
        <span class="stat-val" id="stat-status" style="font-size:13px;color:var(--muted)">Idle</span>
        <span class="stat-label">Status</span>
      </div>
    </div>

    <!-- Progress -->
    <div class="progress-wrap">
      <div class="current-url" id="current-url">&nbsp;</div>
      <div class="progress-bar">
        <div class="progress-fill" id="progress-fill"></div>
      </div>
    </div>

    <!-- Results -->
    <div class="results-area" id="results-area">
      <div class="empty-state" id="empty-state">
        <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
        </svg>
        <p>Configure your scan and click <strong>Start Scan</strong></p>
      </div>
    </div>

    <!-- Done banner (inside results-area, inserted by JS) -->
  </main>

</div>

<script>
  let mode = 'crawl';
  let evtSource = null;
  let stopped = false;
  let maxPages = 50;
  let results = [];

  function setMode(m) {
    mode = m;
    document.querySelectorAll('.tab-btn').forEach((b, i) => {
      b.classList.toggle('active', ['crawl','list','both'][i] === m);
    });
    document.getElementById('field-start').style.display = (m === 'list') ? 'none' : '';
    document.getElementById('field-list').style.display  = (m === 'crawl') ? 'none' : '';
    document.getElementById('crawl-opts').style.display = (m === 'list') ? 'none' : '';
    document.getElementById('domain-toggle-wrap').style.display = (m === 'list') ? 'none' : '';
  }

  function startScan() {
    const keywords = document.getElementById('keywords').value.trim();
    if (!keywords) { alert('Please enter at least one keyword.'); return; }

    const startUrl  = document.getElementById('start-url').value.trim();
    const urlList   = document.getElementById('url-list').value.trim();
    if (mode === 'crawl' && !startUrl) { alert('Please enter a starting URL.'); return; }
    if (mode === 'list'  && !urlList)  { alert('Please enter at least one URL in the list.'); return; }
    if (mode === 'both'  && !startUrl && !urlList) { alert('Please enter at least one URL.'); return; }

    maxPages = parseInt(document.getElementById('max-pages').value) || 50;
    stopped = false;
    results = [];

    // Reset UI
    document.getElementById('stat-scanned').textContent = '0';
    document.getElementById('stat-found').textContent   = '0';
    document.getElementById('stat-status').textContent  = 'Scanning…';
    document.getElementById('stat-status').style.color  = 'var(--accent)';
    document.getElementById('progress-fill').style.width = '0%';
    document.getElementById('btn-scan').disabled = true;
    document.getElementById('btn-stop').style.display = 'block';

    const area = document.getElementById('results-area');
    area.innerHTML = '';

    fetch('/scan', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        start_url:       startUrl,
        url_list:        urlList,
        keywords:        keywords,
        max_depth:       parseInt(document.getElementById('max-depth').value) || 2,
        max_pages:       maxPages,
        same_domain_only: document.getElementById('same-domain').checked,
      })
    })
    .then(r => r.json())
    .then(data => {
      if (data.error) { alert(data.error); resetUI(); return; }
      listenStream(data.scan_id);
    })
    .catch(err => { alert('Error: ' + err); resetUI(); });
  }

  function listenStream(scanId) {
    if (evtSource) evtSource.close();
    evtSource = new EventSource('/stream/' + scanId);

    evtSource.onmessage = (e) => {
      if (stopped) { evtSource.close(); return; }
      const msg = JSON.parse(e.data);

      if (msg.type === 'ping') return;

      if (msg.type === 'progress') {
        document.getElementById('stat-scanned').textContent = msg.scanned;
        document.getElementById('current-url').textContent  = '⟶ ' + msg.url;
        const pct = Math.min(100, (msg.scanned / maxPages) * 100);
        document.getElementById('progress-fill').style.width = pct + '%';
      }

      if (msg.type === 'match') {
        results.push(msg);
        document.getElementById('stat-found').textContent = results.length;
        appendMatch(msg);
      }

      if (msg.type === 'error') {
        appendError(msg);
      }

      if (msg.type === 'done') {
        document.getElementById('stat-scanned').textContent = msg.scanned;
        document.getElementById('stat-status').textContent  = 'Done';
        document.getElementById('stat-status').style.color  = 'var(--match)';
        document.getElementById('progress-fill').style.width = '100%';
        document.getElementById('current-url').textContent  = '';
        appendDoneBanner(msg);
        resetUI();
        evtSource.close();
      }
    };

    evtSource.onerror = () => { evtSource.close(); resetUI(); };
  }

  function appendMatch(msg) {
    const area = document.getElementById('results-area');
    const card = document.createElement('div');
    card.className = 'result-card';

    const kwHTML = msg.matches.map(m =>
      `<span class="kw-tag">${esc(m.keyword)}</span>`
    ).join('');

    const snippetHTML = msg.matches
      .filter(m => m.snippet)
      .map(m => `<div class="snippet">${esc(m.snippet)}</div>`)
      .join('');

    card.innerHTML = `
      <a class="result-url" href="${esc(msg.url)}" target="_blank" rel="noopener">${esc(msg.url)}</a>
      <div class="kw-tags">${kwHTML}</div>
      ${snippetHTML}
    `;
    area.appendChild(card);
    area.scrollTop = area.scrollHeight;
  }

  function appendError(msg) {
    const area = document.getElementById('results-area');
    const card = document.createElement('div');
    card.className = 'result-card error-card';
    card.innerHTML = `
      <a class="result-url" style="color:var(--error)" href="${esc(msg.url)}" target="_blank" rel="noopener">${esc(msg.url)}</a>
      <div class="snippet" style="border-color:var(--error);color:var(--error)">${esc(msg.error)}</div>
    `;
    area.appendChild(card);
  }

  function appendDoneBanner(msg) {
    const area = document.getElementById('results-area');
    const banner = document.createElement('div');
    banner.className = 'done-banner';
    banner.style.display = 'flex';
    banner.innerHTML = `
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
      Scan complete — ${msg.scanned} pages scanned, ${msg.found} matches found.
      <button class="export-btn" onclick="exportCSV()">Export CSV</button>
    `;
    area.insertBefore(banner, area.firstChild);
  }

  function stopScan() {
    stopped = true;
    if (evtSource) evtSource.close();
    document.getElementById('stat-status').textContent = 'Stopped';
    document.getElementById('stat-status').style.color = 'var(--warn)';
    resetUI();
  }

  function resetUI() {
    document.getElementById('btn-scan').disabled = false;
    document.getElementById('btn-stop').style.display = 'none';
  }

  function exportCSV() {
    const rows = [['URL', 'Keywords', 'Snippet']];
    results.forEach(r => {
      r.matches.forEach(m => {
        rows.push([r.url, m.keyword, m.snippet]);
      });
    });
    const csv = rows.map(r => r.map(c => `"${(c||'').replace(/"/g,'""')}"`).join(',')).join('\n');
    const blob = new Blob([csv], { type: 'text/csv' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'scan-results.csv';
    a.click();
  }

  function esc(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
</script>

</body>
</html>
